<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening file...</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        color: #1c1917;
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid #d6d3d1;
        border-radius: 12px;
        background: #ffffff;
        padding: 16px 18px;
      }
      p {
        margin: 0;
      }
      .muted {
        margin-top: 8px;
        color: #78716c;
        font-size: 0.92rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c0a09;
          color: #f5f5f4;
        }
        .card {
          border-color: #44403c;
          background: #1c1917;
        }
        .muted {
          color: #a8a29e;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p id="status">Opening file...</p>
      <p class="muted">If it does not open automatically, the link may be invalid or expired.</p>
    </div>

    <script>
      (function () {
        const statusEl = document.getElementById('status');
        const params = new URLSearchParams(window.location.search);
        const shortPath = String(params.get('p') || '').trim();
        const token = String(params.get('t') || '').trim();

        if (!shortPath || !token) {
          statusEl.textContent = 'Invalid short link.';
          return;
        }

        const bucket = 'shivgandhi30.firebasestorage.app';
        const ownerUid = 'jkfTRq5tyTRnMFLkzkB0USUGzjd2';
        const objectPath = `private/${ownerUid}/${shortPath.replace(/^\/+|\/+$/g, '')}`;
        const target =
          `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(objectPath)}` +
          `?alt=media&token=${encodeURIComponent(token)}`;

        window.location.replace(target);
      })();
    </script>
  </body>
</html>
