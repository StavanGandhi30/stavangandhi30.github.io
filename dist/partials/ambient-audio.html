    <div
      class="ambient-audio-panel"
      data-ambient-panel
      role="region"
      aria-label="Background music — on, mute, and volume"
    >
      <audio id="ambient-audio" preload="metadata" loop playsinline>
        <source
          src="https://firebasestorage.googleapis.com/v0/b/shivgandhi30.firebasestorage.app/o/audio%2FFluteAudio.mp3?alt=media&token=1dccceca-4562-4a9c-9541-1181bb6891de"
          type="audio/mpeg"/>
      </audio>
      <div class="ambient-audio-panel__row">
        <div class="ambient-audio-panel__playback" role="group" aria-label="Music power and mute">
          <button
            type="button"
            class="ambient-audio-panel__toggle"
            data-ambient-power
            aria-pressed="false"
            aria-label="Turn background music on"
          >
            <span class="flex" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="h-[15px] w-[15px]" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v10" />
                <path d="M18.4 6.6a9 9 0 1 1-12.77 0" />
              </svg>
            </span>
          </button>
          <button
            type="button"
            class="ambient-audio-panel__toggle"
            data-ambient-mute
            aria-pressed="false"
            aria-label="Mute background music"
            disabled
          >
            <span data-ambient-unmuted class="flex" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="h-[15px] w-[15px]" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6 9H2v6h4l5 4V5Z" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M17.66 6.34a8 8 0 0 1 0 11.32" />
              </svg>
            </span>
            <span data-ambient-muted class="hidden" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="h-[15px] w-[15px]" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6 9H2v6h4l5 4V5Z" />
                <line x1="23" y1="9" x2="17" y2="15" />
                <line x1="17" y1="9" x2="23" y2="15" />
              </svg>
            </span>
          </button>
        </div>
        <div class="ambient-audio-panel__vol">
          <input
            id="ambient-volume"
            class="ambient-audio-panel__range"
            type="range"
            data-ambient-volume
            min="0"
            max="1"
            step="0.05"
            value="0.25"
            aria-valuemin="0"
            aria-valuemax="1"
            aria-describedby="ambient-volume-hint"
          />
        </div>
      </div>
    </div>
